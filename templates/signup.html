{% extends 'base.html' %}

{% block title %}RetinaScan | Sign Up{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="card auth-card">
        <h1>Create your account</h1>
        <p class="subtitle">Join RetinaScan to start secure screening workflows.</p>

        <form method="post" class="auth-form">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" value="{{ name if name else '' }}" required>

            <label for="email">Email address</label>
            <input type="email" id="email" name="email" value="{{ email if email else '' }}" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="6" required>

            <label for="confirm_password">Confirm password</label>
            <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>

            <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
