{% extends 'base.html' %}

{% block title %}Profile — RetinaScan{% endblock %}

{% block content %}

<style>
    .profile-card {
        width: 100%;
        max-width: 700px;
        margin: 30px auto;
        padding: 30px;
        box-sizing: border-box;
        border-radius: 16px;
    }

    .profile-card h2 {
        margin: 0 0 25px;
        padding-bottom: 18px;
        font-size: 26px;
        font-weight: 700;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .profile-details {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .profile-row {
        display: grid;
        grid-template-columns: 160px 1fr;
        align-items: center;
        min-height: 52px;
        padding: 0 18px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.025);
        border: 1px solid rgba(0, 0, 0, 0.06);
        box-sizing: border-box;
    }

    .profile-label {
        font-size: 13px;
        font-weight: 600;
        opacity: 0.7;
    }

    .profile-value {
        font-size: 14px;
        font-weight: 500;
        word-break: break-word;
    }

    @media (max-width: 600px) {
        .profile-card {
            margin: 18px auto;
            padding: 20px;
        }

        .profile-card h2 {
            font-size: 22px;
        }

        .profile-row {
            grid-template-columns: 1fr;
            gap: 5px;
            padding: 12px 14px;
        }
    }
</style>

<section class="card profile-card">

    <h2>Profile</h2>

    <div class="profile-details">

        <div class="profile-row">
            <div class="profile-label">Name</div>
            <div class="profile-value">
                {{ session.get('user_name') }}
            </div>
        </div>

        <div class="profile-row">
            <div class="profile-label">Email</div>
            <div class="profile-value">
                {{ session.get('user_email') }}
            </div>
        </div>

        <div class="profile-row">
            <div class="profile-label">Member since</div>
            <div class="profile-value">
                {{ user_created_at if user_created_at else 'Unknown' }}
            </div>
        </div>

    </div>

</section>

{% endblock %}
